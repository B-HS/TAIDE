[package]
name = "taide-terminal-core-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace]
members = ["vendor/vte"]
default-members = ["."]

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
taide-infra = { path = "../../crates/taide-infra" }
taide-native-retained = { path = "../../native/taide-native-retained" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[patch.crates-io]
vte = { path = "vendor/vte" }
