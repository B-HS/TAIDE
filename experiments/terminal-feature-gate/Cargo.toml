[package]
name = "taide-terminal-feature-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace]

[features]
default = []
serde = ["alacritty_terminal/serde", "dep:serde_json"]
native-retained = ["alacritty_terminal/native-retained"]

[dependencies]
alacritty_terminal = { version = "=0.26.0", path = "../../native/taide-native-terminal/vendor/alacritty-terminal", default-features = false }
serde_json = { version = "1", optional = true }

[patch.crates-io]
vte = { path = "../terminal-core-spike/vendor/vte" }
