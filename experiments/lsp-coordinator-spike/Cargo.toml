[package]
name = "taide-lsp-coordinator-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace]

[dependencies]
serde_json = "=1.0.151"
taide-lsp = { path = "../../crates/taide-lsp" }

[dev-dependencies]
taide-infra = { path = "../../crates/taide-infra" }
taide-runtime = { path = "../../crates/taide-runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
