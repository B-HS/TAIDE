<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>TAIDE isolated Rust canvas probe</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            canvas {
                width: 100%;
                flex: 1;
                min-height: 0;
                display: block;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <button id="close" type="button">Close canvas</button>
        <button id="abort" type="button">Abort canvas</button>
        <button id="drop" type="button">Drop</button>
        <pre id="state">{}</pre>
        <script type="module">
            import init, { ApplicationProbe, CanvasProbe } from '/probe.js'
            await init()
            const response = await fetch('/__fixture/settings', { method: 'POST', body: ApplicationProbe.default_settings() })
            if (!response.ok) throw new Error('Synthetic settings setup failed')
            let probe = await CanvasProbe.start(document.getElementById('canvas'))
            document.getElementById('state').addEventListener('snapshot', () => {
                document.getElementById('state').textContent = probe.snapshot()
            })
            document.getElementById('close').addEventListener('click', () => probe.request_close())
            document.getElementById('abort').addEventListener('click', () => probe.abort())
            document.getElementById('drop').addEventListener('click', () => {
                probe.free()
                probe = null
            })
            document.getElementById('state').textContent = probe.snapshot()
            document.getElementById('state').setAttribute('data-ready', 'true')
        </script>
    </body>
</html>
