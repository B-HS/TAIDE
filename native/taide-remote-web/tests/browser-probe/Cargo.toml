[package]
name = "taide-remote-browser-probe"
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[features]
canvas = ["taide-remote-web/canvas", "dep:wasm-bindgen-futures"]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
taide-remote-web = { path = "../..", features = ["inspection"] }
taide-model = { path = "../../../../crates/taide-model" }
taide-native-ui = { path = "../../../taide-native-ui", default-features = false, features = ["inspection"] }
taide-native-editor = { path = "../../../taide-native-editor" }
egui = "=0.36.2"
wasm-bindgen = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }

[patch.crates-io]
egui = { path = "../../../taide-native-app/vendor/egui-input" }
