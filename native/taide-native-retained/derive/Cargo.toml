[package]
name = "taide-native-retained-derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", default-features = false, features = ["derive", "parsing", "printing", "proc-macro", "clone-impls"] }
