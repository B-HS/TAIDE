[package]
name = "taide-sync"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[dependencies]
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taide-infra = { path = "../taide-infra" }
taide-locale = { path = "../taide-locale" }
taide-model = { path = "../taide-model" }
taide-settings = { path = "../taide-settings" }
taide-theme = { path = "../taide-theme" }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt"] }
uuid = { version = "1", features = ["v4"] }
