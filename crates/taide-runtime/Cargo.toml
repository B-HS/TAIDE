[package]
name = "taide-runtime"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[dependencies]
log = "0.4"
parking_lot = "0.12"
serde_json = "1"
taide-agent = { path = "../taide-agent" }
taide-ai = { path = "../taide-ai" }
taide-app = { path = "../taide-app" }
taide-file = { path = "../taide-file" }
taide-git = { path = "../taide-git" }
taide-ide = { path = "../taide-ide" }
taide-infra = { path = "../taide-infra" }
taide-layout = { path = "../taide-layout" }
taide-locale = { path = "../taide-locale" }
taide-lsp = { path = "../taide-lsp" }
taide-model = { path = "../taide-model" }
taide-notification = { path = "../taide-notification" }
taide-plugin = { path = "../taide-plugin" }
taide-project = { path = "../taide-project" }
taide-remote = { path = "../taide-remote" }
taide-search = { path = "../taide-search" }
taide-settings = { path = "../taide-settings" }
taide-snippet = { path = "../taide-snippet" }
taide-sync = { path = "../taide-sync" }
taide-system = { path = "../taide-system" }
taide-task = { path = "../taide-task" }
taide-terminal = { path = "../taide-terminal" }
taide-theme = { path = "../taide-theme" }
taide-tree = { path = "../taide-tree" }
taide-vsix = { path = "../taide-vsix" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net"] }
uuid = { version = "1", features = ["v4"] }
