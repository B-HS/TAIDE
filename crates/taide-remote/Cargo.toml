[package]
name = "taide-remote"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[dependencies]
parking_lot = "0.12"
taide-infra = { path = "../taide-infra" }
taide-locale = { path = "../taide-locale" }
taide-model = { path = "../taide-model" }
taide-remote-wire = { path = "../taide-remote-wire" }
sha2 = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
