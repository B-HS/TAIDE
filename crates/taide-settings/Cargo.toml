[package]
name = "taide-settings"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taide-infra = { path = "../taide-infra" }
taide-model = { path = "../taide-model" }
taide-theme = { path = "../taide-theme" }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
