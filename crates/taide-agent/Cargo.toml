[package]
name = "taide-agent"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[dependencies]
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
taide-infra = { path = "../taide-infra" }
taide-model = { path = "../taide-model" }
tokio = { version = "1", features = ["rt"] }
