[workspace]
resolver = "2"
members = ["src-tauri", "crates/taide-ai", "crates/taide-app", "crates/taide-cli", "crates/taide-file", "crates/taide-font", "crates/taide-infra", "crates/taide-locale", "crates/taide-model", "crates/taide-notification", "crates/taide-plugin", "crates/taide-project", "crates/taide-search", "crates/taide-settings", "crates/taide-snippet", "crates/taide-sync", "crates/taide-system", "crates/taide-task", "crates/taide-theme", "crates/taide-tree", "crates/taide-vsix"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Release codegen with symbols kept, for `sample`/Instruments/`cargo flamegraph` only.
# `[profile.release]` above strips symbols, which makes a release binary unprofilable.
# Opt in explicitly with `cargo build --profile profiling`; nothing references it implicitly —
# `tauri build` uses `release` (or `--debug`), and CI builds neither.
# See docs/debugging.md §4.2.
[profile.profiling]
inherits = "release"
strip = false
debug = 1
