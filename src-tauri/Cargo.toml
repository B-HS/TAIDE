[package]
name = "taide"
version = "0.2.6"
description = "TAIDE — agent-native IDE"
license = "MIT"
authors = ["Hyunseok Byun"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "taide_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }

git2 = { version = "0.21", default-features = false, features = ["ssh", "https", "vendored-libgit2", "vendored-openssl"] }
log = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
parking_lot = "0.12"
regex = "1"
trash = "5"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.39"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
xz2 = { version = "0.1", features = ["static"] }

specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
ignore = "0.4.30"
taide-agent = { path = "../crates/taide-agent" }
taide-ai = { path = "../crates/taide-ai" }
taide-app = { path = "../crates/taide-app" }
taide-file = { path = "../crates/taide-file" }
taide-font = { path = "../crates/taide-font" }
taide-git = { path = "../crates/taide-git" }
taide-ide = { path = "../crates/taide-ide" }
taide-infra = { path = "../crates/taide-infra" }
taide-layout = { path = "../crates/taide-layout" }
taide-locale = { path = "../crates/taide-locale" }
taide-model = { path = "../crates/taide-model" }
taide-notification = { path = "../crates/taide-notification" }
taide-plugin = { path = "../crates/taide-plugin" }
taide-project = { path = "../crates/taide-project" }
taide-search = { path = "../crates/taide-search" }
taide-settings = { path = "../crates/taide-settings" }
taide-snippet = { path = "../crates/taide-snippet" }
taide-sync = { path = "../crates/taide-sync" }
taide-system = { path = "../crates/taide-system" }
taide-task = { path = "../crates/taide-task" }
taide-terminal = { path = "../crates/taide-terminal" }
taide-theme = { path = "../crates/taide-theme" }
taide-tree = { path = "../crates/taide-tree" }
taide-vsix = { path = "../crates/taide-vsix" }
taide-window = { path = "../crates/taide-window" }

[dev-dependencies]
taide-infra = { path = "../crates/taide-infra", features = ["test-support"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
