# Warms the rust-cache entries the tag-only release.yml can restore (GitHub cache scoping:
# tag refs only see caches created on main). Decision: docs/acknowledge/2026-08-29-audit-followup-user-decisions.md
name: Cache Warm

on:
    push:
        branches: [main]
        paths:
            - 'Cargo.lock'
            - 'Cargo.toml'
            - 'src-tauri/**'
            - 'crates/**'
            - '.github/workflows/cache-warm.yml'

concurrency:
    group: cache-warm
    cancel-in-progress: true

jobs:
    warm-release:
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: '.'
                  shared-key: release

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # sidecar + vite + cargo release compile without signing/notarization/dmg
            - name: Warm release build
              run: bun run tauri build --no-bundle

    warm-tests:
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: '.'
                  shared-key: tests

            - name: Compile tests
              working-directory: src-tauri
              run: cargo test --workspace --no-run
