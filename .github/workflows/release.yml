name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    test-frontend:
        runs-on: macos-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Frontend tests
              run: bun run test

    test-rust:
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: '.'
                  shared-key: tests

            - name: Rust tests
              working-directory: src-tauri
              run: cargo test --workspace

    build:
        runs-on: macos-latest
        timeout-minutes: 75
        steps:
            - uses: actions/checkout@v4

            # ABSOLUTE RULE: release tags must NEVER contain the digit 4 (owner directive, 2026-08-28).
            # Version numbers containing 4 are skipped entirely (e.g. 0.3.x -> 0.5.0).
            # See docs/acknowledge/2026-08-28-release-tag-no-digit-4.md
            - name: Verify tag contains no digit 4
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  case "$GITHUB_REF_NAME" in
                    *4*)
                      printf 'tag %s contains the forbidden digit 4 — release tags must never include 4 (see docs/acknowledge/2026-08-28-release-tag-no-digit-4.md)\n' "$GITHUB_REF_NAME" >&2
                      exit 1
                      ;;
                  esac

            - name: Verify tag matches app version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  APP_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
                  if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
                    printf 'tag %s does not match tauri.conf.json version %s\n' "$GITHUB_REF_NAME" "$APP_VERSION" >&2
                    exit 1
                  fi
                  CARGO_VERSION=$(awk -F'"' '/^\[package\]/{f=1} f && /^version/{print $2; exit}' src-tauri/Cargo.toml)
                  if [ "v$CARGO_VERSION" != "$GITHUB_REF_NAME" ]; then
                    printf 'tag %s does not match src-tauri/Cargo.toml version %s\n' "$GITHUB_REF_NAME" "$CARGO_VERSION" >&2
                    exit 1
                  fi

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: '.'
                  shared-key: release
                  save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Configure Apple code signing
              env:
                  CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
                  CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
                  SIGNING_IDENTITY_OVERRIDE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
                  NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  if [ -n "$CERT_P12" ]; then
                    # tolerate wrapped/pasted base64 (newlines, CR, spaces) — decode expects one clean line
                    CERT_P12="$(printf '%s' "$CERT_P12" | tr -d ' \t\r\n')"
                    IDENTITY="$SIGNING_IDENTITY_OVERRIDE"
                    if [ -z "$IDENTITY" ]; then
                      PROBE_DIR="$(mktemp -d)"
                      printf '%s' "$CERT_P12" | base64 -d > "$PROBE_DIR/cert.p12"
                      KEYCHAIN="$PROBE_DIR/probe.keychain-db"
                      security create-keychain -p probe "$KEYCHAIN"
                      security unlock-keychain -p probe "$KEYCHAIN"
                      security import "$PROBE_DIR/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
                      IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
                      security delete-keychain "$KEYCHAIN"
                      rm -rf "$PROBE_DIR"
                    fi
                    if [ -z "$IDENTITY" ]; then
                      echo "failed to derive signing identity from MACOS_CERTIFICATE_P12" >&2
                      exit 1
                    fi
                    {
                      echo "APPLE_CERTIFICATE=$CERT_P12"
                      echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
                      echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
                    } >> "$GITHUB_ENV"
                    printf 'code signing: enabled (%s)\n' "$IDENTITY"
                  else
                    echo "code signing: skipped (MACOS_CERTIFICATE_P12 not set)"
                  fi
                  if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
                    {
                      echo "APPLE_ID=$NOTARY_APPLE_ID"
                      echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
                      echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
                    } >> "$GITHUB_ENV"
                    echo "notarization: enabled"
                  else
                    echo "notarization: skipped (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID not all set)"
                  fi

            - name: Build app bundle
              run: bun run tauri build

            - name: Verify bundle is self-contained
              run: |
                  APP=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
                  if [ -z "$APP" ]; then
                    echo "no .app bundle found under target/release/bundle/macos (workspace-root target)" >&2
                    exit 1
                  fi
                  STATUS=0
                  while IFS= read -r BIN; do
                    if otool -L "$BIN" | grep -E '/opt/homebrew|/usr/local'; then
                      printf 'non-system dylib linkage in %s - bundle is not self-contained\n' "$BIN" >&2
                      STATUS=1
                    fi
                  done < <(find "$APP/Contents/MacOS" -type f -perm +111)
                  if [ "$STATUS" -eq 0 ]; then
                    echo "self-contained: no /opt/homebrew or /usr/local linkage"
                  fi
                  exit "$STATUS"

            - name: Collect artifacts
              run: |
                  mkdir -p dist-release
                  cp target/release/bundle/dmg/*.dmg dist-release/
                  # GitHub는 릴리스 에셋 이름의 공백을 점으로 바꿔 서빙하므로, SHA256SUMS 가 실제 파일명과
                  # 어긋나지 않도록 업로드 전에 미리 리네임한다
                  for f in dist-release/*' '*; do
                    [ -e "$f" ] || continue
                    mv "$f" "${f// /.}"
                  done
                  (cd dist-release && shasum -a 256 *.dmg > SHA256SUMS.txt)
                  cat dist-release/SHA256SUMS.txt

            - uses: actions/upload-artifact@v4
              with:
                  name: taide-dmg
                  path: dist-release/*

    release:
        needs: [build, test-frontend, test-rust]
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: macos-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: taide-dmg
                  path: dist-release

            # Release notes are mandatory: docs/release-notes/<tag>.md is the release body.
            - name: Verify release notes exist
              run: |
                  NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
                  if [ ! -f "$NOTES" ]; then
                    printf 'missing release notes: %s — write them before tagging (docs/deployment.md §3)\n' "$NOTES" >&2
                    exit 1
                  fi

            - uses: softprops/action-gh-release@v2
              with:
                  draft: true
                  files: dist-release/*
                  body_path: docs/release-notes/${{ github.ref_name }}.md
